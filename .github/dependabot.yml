version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7.x is the native (Go) port: its npm package exposes only the
      # experimental `typescript/unstable/*` API, not the classic compiler API.
      # Next.js's build-time TS config validation and typescript-eslint (peer
      # `typescript >=4.8.4 <6.1.0`) both require the classic API, so a 7.x bump
      # breaks `next build` and `bun run lint`. Stay on 6.x until the toolchain
      # ships native-port support. See #536 (and #499, the bump this blocks).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # The Rust workspace. Absent until the daemon shipped, so `Cargo.lock` was
  # updated only by hand — for a dependency tree that includes the TLS stack
  # compiled into a root-installed system service.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the whole tree rather than five a week: these crates are
      # verified together by `cargo test --workspace`, and splitting them means
      # each PR rebuilds the same lockfile the others just changed.
      rust-dependencies:
        patterns:
          - "*"

  # The `fp` CLI (PyPI: fp-cloud-cli) — the only Python in the repo. Its lockfile is
  # `fp-cloud-cli/uv.lock`, so the ecosystem is `uv`, and the directory is the package
  # root rather than `/`. Grouped for the same reason as the Rust tree: the whole
  # dependency set is verified together by one pytest run, and separate PRs each
  # rebuild the lockfile the others just changed.
  - package-ecosystem: uv
    directory: /fp-cloud-cli
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The telemetry SDK (PyPI: failproofai-sdk). Its own lockfile and its own uv
  # ecosystem entry — dependabot resolves per directory, so fp-cloud-cli's entry above
  # does not see this tree at all. The only things in the lockfile are the test
  # runner and its transitive deps: the package itself declares NO runtime
  # dependencies, and `tests/test_zero_dependencies.py` fails if that changes.
  - package-ecosystem: uv
    directory: /sdk/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The TypeScript SDK's integration fixtures that hold each framework's supported
  # FLOOR. These four entries are for security updates alone —
  # `open-pull-requests-limit: 0` turns version updates off — and exist to stop one
  # move. Each floor carries an advisory whose only fix is a major its framework
  # release cannot take (SECURITY.md, "Accepted, with no fix available"), and
  # Dependabot's grouped security updates reach that fix by moving the framework off
  # the line the fixture exists to test: #838, #931, and #935, which opened three
  # minutes after #934 put the pins back. `ignore` applies to security updates too,
  # so each range below keeps the framework on its line, and zod on 3 where the
  # framework requires it; every fix that stays on the line still arrives. Ranges
  # are `versions`, never `update-types`, which security updates do not read. A new
  # floor fixture needs an entry here: __tests__/ci/ts-sdk-fixture-pins.test.ts
  # fails without one.
  - package-ecosystem: npm
    directory: /sdk/typescript/integration/fixtures/ai-4
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: ai
        versions: [">=5.0.0"]
      # ai@4.3.19 peers on zod ^3.23.8.
      - dependency-name: zod
        versions: [">=4.0.0"]

  - package-ecosystem: npm
    directory: /sdk/typescript/integration/fixtures/langchain-0.3
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "@langchain/core"
        versions: [">=0.4.0"]
      # @langchain/langgraph@0.4.10 peers on @langchain/core <0.4.0.
      - dependency-name: "@langchain/langgraph"
        versions: [">=0.5.0"]
      # Both depend on zod ^3.25.32. A zod 4 here would still install, nested
      # under them, so nothing but this range keeps the fixture's own zod on 3.
      - dependency-name: zod
        versions: [">=4.0.0"]

  - package-ecosystem: npm
    directory: /sdk/typescript/integration/fixtures/llamaindex-0.11
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: llamaindex
        versions: [">=0.12.0"]
      # @llamaindex/core@0.6.8 and @llamaindex/workflow@1.1.5 need zod ^3.23.8.
      - dependency-name: zod
        versions: [">=4.0.0"]

  - package-ecosystem: npm
    directory: /sdk/typescript/integration/fixtures/mastra-0
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    ignore:
      # @mastra/core, and the @mastra/memory and @mastra/mcp releases paired with it.
      - dependency-name: "@mastra/*"
        versions: [">=1.0.0"]
      # @mastra/core@0.24.9 requires ai@^4. This fixture's own zod is already 4.
      - dependency-name: ai
        versions: [">=5.0.0"]
