version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7.x is the native (Go) port: its npm package exposes only the
      # experimental `typescript/unstable/*` API, not the classic compiler API.
      # Next.js's build-time TS config validation and typescript-eslint (peer
      # `typescript >=4.8.4 <6.1.0`) both require the classic API, so a 7.x bump
      # breaks `next build` and `bun run lint`. Stay on 6.x until the toolchain
      # ships native-port support. See #536 (and #499, the bump this blocks).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # The Rust workspace. Absent until the daemon shipped, so `Cargo.lock` was
  # updated only by hand — for a dependency tree that includes the TLS stack
  # compiled into a root-installed system service.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the whole tree rather than five a week: these crates are
      # verified together by `cargo test --workspace`, and splitting them means
      # each PR rebuilds the same lockfile the others just changed.
      rust-dependencies:
        patterns:
          - "*"

  # The `fp` CLI (PyPI: fp-cloud-cli) — the only Python in the repo. Its lockfile is
  # `fp-cloud-cli/uv.lock`, so the ecosystem is `uv`, and the directory is the package
  # root rather than `/`. Grouped for the same reason as the Rust tree: the whole
  # dependency set is verified together by one pytest run, and separate PRs each
  # rebuild the lockfile the others just changed.
  - package-ecosystem: uv
    directory: /fp-cloud-cli
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The telemetry SDK (PyPI: failproofai-sdk). Its own lockfile and its own uv
  # ecosystem entry — dependabot resolves per directory, so fp-cloud-cli's entry above
  # does not see this tree at all. The only things in the lockfile are the test
  # runner and its transitive deps: the package itself declares NO runtime
  # dependencies, and `tests/test_zero_dependencies.py` fails if that changes.
  - package-ecosystem: uv
    directory: /sdk/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The TypeScript SDK's integration fixtures — the first `npm` entry in this
  # file, and it exists to turn things OFF. Fifteen real consumer projects, each
  # pinning every direct dependency exactly, each holding one framework major on
  # purpose: the major is in the directory name (`ai-4`, `mastra-0`,
  # `langchain-0.3`), and even the current-major ones are paired, `nextjs`
  # holding `ai@7.0.111` to stay the twin of `ai-7` whose trace
  # `nextjs.test.ts` compares every route against. A major bump here does not
  # update a fixture; it deletes the release the fixture exists to hold and
  # drops a supported version from the matrix silently.
  #
  # `open-pull-requests-limit: 0` switches off VERSION updates. It does NOT
  # switch off security updates — those are explicitly exempt from the limit —
  # so it alone would have stopped neither #838 nor #867, both of which arrived
  # as security PRs in the `npm_and_yarn` group.
  #
  # `versions: [">= 0"]` is what stops them, and the spelling is load-bearing.
  # `update-types: ["version-update:semver-major"]` reads like the right way to
  # say "never bump a major here" and is silently inert against exactly the PRs
  # this entry exists to prevent: in dependabot-core,
  # `Config::IgnoreCondition#ignored_versions` opens with
  #
  #     return versions if security_updates_only
  #
  # so on a security update only the explicit `versions:` list is consulted and
  # `update_types` is never read at all. An ignore with no `versions:` returns an
  # empty list there and blocks nothing. (Name matching is unaffected —
  # `UpdateConfig#ignored_versions_for` selects conditions by wildcard on the
  # name before this, regardless of update kind, so `"*"` does apply.)
  #
  # `>= 0` is dependabot's own ALL_VERSIONS constant, so this ignores every
  # version of every dependency in these directories — which sounds larger than
  # it is, because for these fixtures a security PR can only ever propose moving
  # a pin. The frameworks pin their transitive deps EXACTLY (`ai@4.3.19`
  # requires `jsondiffpatch@0.6.0`, not `^0.6.0`), which is what makes the
  # lockfiles reproducible and is why #837 found `npm update` reporting all five
  # affected fixtures already up to date while the advisories stood against
  # them. There is no in-range fix for dependabot to offer. Its record here is
  # two PRs, both the forbidden move, one of which did not install:
  # `@mastra/mcp@0.14.5` peers on `@mastra/core@">=0.20.1-0 <0.25.0-0"`, so #867
  # failed `ERESOLVE`, and because the shard's global setup installs every
  # fixture before any test runs, that one fixture took down three shards whole.
  #
  # What this does NOT suppress is the part that actually drives remediation.
  # Dependabot ALERTS come from the dependency graph, not from this file: they
  # keep arriving, stay visible in the security tab, and are how `undici` in
  # `ai-5` (#869) and the five overrides in #837 were found and fixed by hand
  # with `overrides` — case 1 of `SECURITY.md`'s fixture triage. Only the PRs
  # stop, and an advisory with no in-range fix lands in that document's accepted
  # table, as two already have.
  - package-ecosystem: npm
    directories:
      - "/sdk/typescript/integration/fixtures/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    ignore:
      # Both keys deliberately: `versions` is the one security updates honor,
      # and dropping it back to `update-types` alone would make this inert.
      - dependency-name: "*"
        versions: [">= 0"]
