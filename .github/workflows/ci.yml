name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAILPROOFAI_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Restore-only here and in every other job; `quality` alone writes, below.
      # All six jobs used to share one read-write `actions/cache@v6` on this key,
      # so all six raced to upload the same 401 MB entry and five of them lost
      # the race — paying the upload to be told the key already existed. One
      # writer is all a shared key can use.
      - uses: actions/cache/restore@v6
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # `--ignore-scripts`, here and in every other job, because package.json's
      # `prepare` is `bun run build` — so a plain `bun install` runs a full
      # Next.js production build (~28s: 14s compile + 13s TypeScript) as an
      # install lifecycle hook, in six of this workflow's eight jobs. Nothing in
      # this job reads `dist/`: tsconfig.json excludes it, eslint.config.mjs
      # ignores it, and no app/ file references Next's generated route types.
      # rust-quality has guarded this way since it landed, and its install takes
      # one second against the thirty-three this one used to.
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/cache/save@v6
        if: steps.bun-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Check version consistency
        run: |
          ROOT_VERSION=$(jq -r .version package.json)
          echo "Root version: $ROOT_VERSION"
          MISMATCH=0
          for pkg in packages/*/package.json; do
            [ -f "$pkg" ] || continue
            PKG_VERSION=$(jq -r .version "$pkg")
            if [ "$PKG_VERSION" != "$ROOT_VERSION" ]; then
              echo "::error file=$pkg::Version mismatch: $pkg has $PKG_VERSION, expected $ROOT_VERSION"
              MISMATCH=1
            fi
          done
          # Check optionalDependencies in wrapper
          for dep_version in $(jq -r '.optionalDependencies // {} | values[]' packages/wrapper/package.json 2>/dev/null || true); do
            if [ "$dep_version" != "$ROOT_VERSION" ]; then
              echo "::error file=packages/wrapper/package.json::Dependency version mismatch: $dep_version, expected $ROOT_VERSION"
              MISMATCH=1
            fi
          done
          # The daemon binaries DO ship as npm platform packages
          # (@failproofai/failproofaid-<os>-<arch>), but their pins are injected
          # into package.json at publish time by
          # scripts/build-daemon-packages.mjs — the same invocation that
          # publishes them, so they cannot drift — and are deliberately absent
          # from the committed tree. Nothing to check here.
          #
          # The Cargo version still has to match, because the release tag the
          # CLI builds its download URL from is the npm version, and the binary
          # at that URL reports the Cargo one.
          # Check the Cargo workspace version (failproofaid) against root package.json
          if [ -f Cargo.toml ]; then
            CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
            if [ "$CARGO_VERSION" != "$ROOT_VERSION" ]; then
              echo "::error file=Cargo.toml::Version mismatch: Cargo.toml has $CARGO_VERSION, expected $ROOT_VERSION"
              MISMATCH=1
            fi
          fi
          if [ "$MISMATCH" -eq 1 ]; then
            echo "::error::Version mismatch detected across package.json files"
            exit 1
          fi
          echo "All versions match: $ROOT_VERSION"

      - name: Lint
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: bun run lint

      - name: Type check
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: bunx tsc --noEmit

  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # This job runs `cargo clippy`/`cargo test` over the full
          # dependency tree, executing third-party build scripts. The
          # default (`true`) would leave GITHUB_TOKEN in .git/config where
          # any of them could read it; nothing here needs push access.
          persist-credentials: false
          # On `pull_request`, actions/checkout builds the merge commit, whose
          # first parent is the base — so depth 2 is exactly enough for the
          # diff below, without fetching the branch's history.
          fetch-depth: 2

      # Two gates in one, both answering "is there Rust work to do here".
      #
      # The first is the original: stage 1 landed an empty Cargo workspace so
      # the CI plumbing could go green before any Rust existed, and
      # `cargo build/clippy/test --workspace` (and even `cargo fmt --all`) all
      # hard-error on a zero-member workspace rather than no-opping cleanly.
      # All three crates exist now, so on its own this always answers true.
      #
      # The second is why it is still here. This is the longest job in CI, so it
      # sets the wall clock for EVERY pull request — including the many that
      # touch no Rust at all, where it restores a cache and recompiles a
      # 231-crate dependency tree to check nothing. Gating on the diff leaves
      # the job reporting a status (no `needs:` edge, no new job, nothing
      # serialised behind it) while finishing in seconds on a TypeScript-only
      # branch. `push` is never gated: main always gets the full check, which is
      # also what keeps the cache warm for everyone else.
      - name: Detect Rust changes
        id: crates
        run: |
          if ! ls crates/*/Cargo.toml >/dev/null 2>&1; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No crates/*/Cargo.toml on this ref — rust-quality has nothing to check."
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything that can change what clippy or the tests see. ci.yml is in
          # the list so a change to this gate always exercises the gate.
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(crates/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Rust-affecting paths in this PR — skipping fmt/clippy/test."
          fi

      - if: steps.crates.outputs.present == 'true'
        run: rustup show

      # cargo test spawns the real TS worker via `bun bin/failproofai-worker.mjs`
      # (crates/failproofaid/src/server.rs's live end-to-end test) — bun has to
      # be on PATH for that test, not just for the TS-side jobs.
      - if: steps.crates.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # …and bun on PATH is not enough on its own. That worker runs the raw
      # TypeScript, so it resolves the handler's real dependency tree at
      # runtime rather than a bundle's. The moment anything under src/hooks
      # imports a third-party package, this job fails with a bun ENOENT that
      # reads like a Rust problem — the failure surfaces as "worker process
      # exited before creating its socket". Production is unaffected, because
      # dist/worker.mjs bundles those deps; only this path needs them on disk.
      - if: steps.crates.outputs.present == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - if: steps.crates.outputs.present == 'true'
        name: Install worker dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Restore on every run, SAVE ONLY ON MAIN — the split `build-daemon.yml`
      # already uses, for a second reason that turned out to matter more.
      #
      # A combined `actions/cache@v6` writes a ref-scoped copy from every branch
      # that misses the exact key, and this entry carries `target/`, so each copy
      # is 1.5-2.3 GiB. Five PR refs held one at once (677, 679, 680, 681 and
      # main) — ~10.7 GiB of a repo cache that GitHub caps at 10 GiB, which puts
      # the store permanently in LRU eviction.
      #
      # What that evicted was not another cargo build. It was the 13 KB
      # translation cache, touched once every 24 hours by the nightly
      # `translate-docs` run and therefore always the least-recently-used thing
      # in the store. Losing it re-translated all 48 pages into all 14 languages
      # the next morning: ~125 runner-minutes and a full LLM pass per language,
      # against a 4-minute baseline when the cache survives. Six consecutive days
      # of it, Aug 6-11, cost ~750 runner-minutes and six full translation passes
      # through the gateway.
      #
      # Restoring without saving costs a PR whose `Cargo.lock` moved a rebuild
      # from a stale-but-close main cache — which is already what `restore-keys`
      # hands it today.
      #
      # That fixed the MULTIPLICATION and left the SIZE, and the size was the
      # bigger half. One entry reached 5,727 MB — 57% of the whole 10 GiB quota
      # in a single key, so the store stayed in permanent LRU eviction against
      # the translation cache anyway — and restoring it took 127 SECONDS, more
      # wall clock than the 74s `cargo test` it was there to avoid. A cache that
      # costs more to move than the work it replaces is not a cache.
      #
      # The cause is `path: target` taken literally: it archives every
      # intermediate the workspace has ever produced, including this workspace's
      # own crates, which recompile in seconds and are the artifacts most likely
      # to be stale. rust-cache caches the dependency artifacts and prunes the
      # rest. It also handles the save gate directly, so the paired
      # `cache/save` step below this is gone.
      - if: steps.crates.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        if: steps.crates.outputs.present == 'true'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: steps.crates.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        if: steps.crates.outputs.present == 'true'
        run: cargo test --workspace

  test:
    runs-on: ubuntu-latest
    # The retry above nominally allows 3 attempts x 10 minutes. Capping the job
    # at 20 is deliberate: a test job deep into a retry storm is a failure worth
    # surfacing, not one worth waiting out.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        env-config:
          - { name: default,       env: {} }
          - { name: log-debug,     env: { FAILPROOFAI_LOG_LEVEL: debug } }
          - { name: hook-log-file, env: { FAILPROOFAI_HOOK_LOG_FILE: "1" } }
    env:
      FAILPROOFAI_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: bun install --frozen-lockfile --ignore-scripts

      # Pinned, because vitest runs under Node and this job had been taking
      # whatever the runner image happened to ship. That is how the suite came
      # to pass here and fail on contributors' machines: from Node 24 on, Node
      # supplies its OWN `localStorage` global, which only works with
      # `--localstorage-file` and otherwise shadows jsdom's with `undefined` —
      # fifteen failures in `project-list.test.tsx`, green in CI. The polyfill
      # in `__tests__/setup.ts` is what actually fixes it; this pin is what
      # keeps CI from silently drifting onto a different runtime again.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The custom-policy loader tests resolve `import ... from 'failproofai'`
      # inside a generated .mjs through findDistIndex(), which needs a real
      # dist/index.js on disk — so with `--ignore-scripts` above, the `prepare`
      # hook is no longer there to have built it. Three milliseconds of bun
      # bundling, against the ~28s full Next build it replaces.
      #
      # This is also why running the whole suite is a bad way to check the
      # dependency: some earlier test writes that file, so the loader tests pass
      # on ordering alone when run together and fail when run on their own.
      - name: Build the policy-loader fixture
        run: bun build src/index.ts --outdir dist --target node --format cjs

      - name: Test (${{ matrix.env-config.name }})
        uses: nick-fields/retry@v4
        env: ${{ matrix.env-config.env }}
        with:
          max_attempts: 3
          timeout_minutes: 10
          command: bun run test:run

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FAILPROOFAI_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: bun install --frozen-lockfile --ignore-scripts

      - name: Build
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 10
          command: bun run build

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Depth 2 so the gate below can diff the PR's merge commit against
          # its first parent. See rust-quality for the full reasoning.
          fetch-depth: 2

      # Same shape as rust-quality's gate, same reason: this job installs a
      # global npm package and a full dependency tree to validate documentation
      # that most pull requests do not touch. On `push` it always runs.
      - name: Detect docs changes
        id: docs
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(docs/|scripts/validate-mdx\.ts$|package\.json$|\.github/workflows/ci\.yml$)|\.mdx$'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No docs-affecting paths in this PR — skipping validation."
          fi

      - if: steps.docs.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - if: steps.docs.outputs.present == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.docs.outputs.present == 'true'
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: bun install --frozen-lockfile --ignore-scripts

      - if: steps.docs.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pinned to match translate-docs.yml, which has always pinned it. Floating
      # here meant an upstream Mintlify release could turn the PR gate red on a
      # branch that changed nothing.
      - name: Install Mintlify CLI
        if: steps.docs.outputs.present == 'true'
        run: npm install -g mintlify@4.2.680

      # Validates docs.json structure + nav-link resolution.
      - name: Validate docs config
        if: steps.docs.outputs.present == 'true'
        working-directory: docs
        run: mintlify validate

      # Parses every MDX page with the same engine Mintlify runs at deploy
      # time. `mintlify validate` does NOT parse page content, so a syntax
      # error (e.g. a translation that breaks a JSX tag or injects a `{#id}`
      # heading anchor) passes that step but fails the post-merge deploy.
      # This catches it on the PR instead. It also verifies every image
      # reference resolves on disk — that class breaks nothing at build time,
      # it just renders as a broken image, so nothing else in CI watches it.
      - name: Validate MDX pages parse and image references resolve
        if: steps.docs.outputs.present == 'true'
        run: bun run validate:mdx

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FAILPROOFAI_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: bun install --frozen-lockfile --ignore-scripts

      # The vitest e2e suite spawns bin/failproofai.mjs with
      # FAILPROOFAI_DIST_PATH pointed here, so it needs dist/index.js. cli.mjs
      # and worker.mjs are for the standalone __tests__/e2e/layout/*.sh
      # fixtures, which are not in the vitest `include` and so were quietly
      # relying on the `prepare` hook having built them during install. Two more
      # bun bundles, ~50ms, and they stay runnable from a CI checkout.
      - name: Build E2E fixtures
        run: |
          bun build src/index.ts --outdir dist --target node --format cjs
          bun run build:cli
          bun run build:worker

      - name: E2E Hook Tests
        uses: nick-fields/retry@v4
        with:
          max_attempts: 2
          timeout_minutes: 10
          command: bun run test:e2e
