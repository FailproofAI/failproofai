name: Cloud CLI stacked parity

# ci.yml does not yet target feat/tui-ux. Its trigger change belongs to #880;
# keep this feature's verification disjoint from that active workflow edit.
on:
  pull_request:
    branches: [feat/tui-ux]
    paths:
      - "fp-cloud-cli/**"
      - "docs/reference/cloud-cli.mdx"
      - ".github/workflows/fp-cli-parity.yml"

permissions:
  contents: read

concurrency:
  group: fp-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-cli:
    name: Cloud CLI parity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: fp-cloud-cli
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: fp-cloud-cli/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Test with filesystem contract required
        env:
          FP_CLI_REQUIRE_CONTRACT: "1"
        run: uv run --extra dev pytest -q
      - name: Build distribution
        run: uv build > /tmp/fp-build.log 2>&1
      - name: Clean wheel install and user-level Cloud smoke
        run: |
          uv venv /tmp/fp-parity-smoke --python ${{ matrix.python-version }}
          uv pip install --python /tmp/fp-parity-smoke/bin/python dist/*.whl
          /tmp/fp-parity-smoke/bin/fp --version
          /tmp/fp-parity-smoke/bin/python tests/fake_cloud_smoke.py \
            --fp /tmp/fp-parity-smoke/bin/fp --artifacts /tmp/fp-parity-artifacts

  docs:
    name: Cloud CLI parity docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install docs dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Parse documentation and resolve images
        run: bun run validate:mdx
      - name: Validate next-beta changelog
        run: python3 scripts/changelog-section.py fp-cloud-cli/CHANGELOG.md 0.0.2b1
