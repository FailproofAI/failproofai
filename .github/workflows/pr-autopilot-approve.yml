# Approve a PR that pr-autopilot reviewed but cannot approve itself, and
# withdraw that approval when pr-autopilot's verdict turns.
#
# Copy to .github/workflows/pr-autopilot-approve.yml in every repo
# pr-autopilot reviews, on the default branch. It runs on repository_dispatch,
# which GitHub always runs from the default branch's copy of this file: no
# dispatcher can pick an edited copy on another branch.
#
# pr-autopilot acts as hermes-exosphere, the account that also opens Kiln's
# and the other agents' PRs. GitHub lets no one approve their own PR, so for
# those pr-autopilot posts its review as a comment and starts this workflow,
# which approves as github-actions[bot]. The org ruleset counts that approval.
#
# It approves only when all of these hold:
#   * hermes-exosphere started it;
#   * the PR is hermes-exosphere's own, still open, and its head is the
#     commit that was reviewed;
#   * hermes-exosphere's LATEST review on that commit carries the approve
#     marker (pr-autopilot's report::approve_marker). An older approving
#     review does not count once a newer one on the commit says otherwise.
# When the latest review does not approve, it dismisses github-actions[bot]'s
# approvals instead, so a newer negative verdict on the same commit revokes
# an earlier approval (pr-autopilot dispatches it for both verdicts). If the
# head moves while the approval is posted, the new approval is dismissed.
# It merges nothing (a person does), never checks out the PR, and takes its
# inputs through env only. A later push drops the approval: the ruleset
# dismisses stale reviews.
#
# What this does not stop: whoever holds hermes-exosphere's token can write
# the marker review and send the dispatch. It keeps pr-autopilot's verdict
# honest and the code that approves fixed; it is not a boundary against
# that token. That would need a second identity (a GitHub App or account).

name: pr-autopilot approve

on:
  # POST /repos/{owner}/{repo}/dispatches with
  # {"event_type": "pr-autopilot-approve", "client_payload": {"pr": "N", "sha": "..."}}
  repository_dispatch:
    types: [pr-autopilot-approve]

permissions:
  pull-requests: write

concurrency: pr-autopilot-approve-${{ github.event.client_payload.pr }}

jobs:
  approve:
    name: Approve pr-autopilot's verdict
    if: github.actor == 'hermes-exosphere'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve or withdraw
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.client_payload.pr }}
          SHA: ${{ github.event.client_payload.sha }}
          BOT: hermes-exosphere
        run: |
          set -euo pipefail
          case "$PR" in ''|*[!0-9]*) echo "not a PR number: $PR"; exit 1;; esac
          case "$SHA" in ''|*[!0-9a-f]*) echo "not a commit: $SHA"; exit 1;; esac
          # Dismiss github-actions[bot]'s standing approvals on this PR.
          withdraw() {
            gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id' |
            while read -r id; do
              gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
                -f event=DISMISS -f message="$1" >/dev/null
              echo "dismissed approval $id: $1"
            done
          }
          pr="$(gh api "repos/$REPO/pulls/$PR")"
          [ "$(jq -r .state <<<"$pr")" = open ] || { echo "PR #$PR is not open"; exit 1; }
          [ "$(jq -r .user.login <<<"$pr")" = "$BOT" ] || { echo "only $BOT's own PRs"; exit 1; }
          [ "$(jq -r .head.sha <<<"$pr")" = "$SHA" ] || { echo "head moved since the review"; exit 1; }
          # Every page, then the newest of BOT's submitted reviews on this
          # commit: by submitted_at (a pending review's id predates its
          # submission), the id breaking one-second ties.
          latest="$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.user.login == env.BOT and .commit_id == env.SHA
                               and .state != "PENDING" and .submitted_at != null)
                  | [.submitted_at, .id, (.body | contains("<!-- pr-autopilot:approve " + env.SHA + " -->"))]
                  | @tsv' \
            | sort -k 1,1 -k 2,2n | tail -n 1)"
          [ -n "$latest" ] || { echo "no pr-autopilot review of $SHA"; exit 1; }
          if [ "${latest##*	}" != true ]; then
            withdraw "pr-autopilot's latest review of ${SHA:0:7} does not approve"
            exit 0
          fi
          have="$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED" and .commit_id == env.SHA) | .id' | head -n 1)"
          [ -z "$have" ] || { echo "already approved ($have)"; exit 0; }
          id="$(gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
            -f commit_id="$SHA" -f event=APPROVE \
            -f body="Approved for pr-autopilot, which reviewed commit \`${SHA:0:7}\` (review above) but cannot approve its own account's PR. A person merges." \
            --jq .id)"
          # A push between the head check and the POST would leave this
          # approval on an old commit, after the ruleset's stale dismissal ran.
          head="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"
          if [ "$head" != "$SHA" ]; then
            gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
              -f event=DISMISS -f message="head moved to ${head:0:7} while ${SHA:0:7} was approved" >/dev/null
            echo "head moved while approving; approval $id dismissed"; exit 1
          fi
          echo "approved ${SHA:0:7} ($id)"
