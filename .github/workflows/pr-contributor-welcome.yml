name: Welcome contributors and approve Dependabot PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  welcome-external-contributor:
    name: Thank and welcome external contributor
    runs-on: ubuntu-latest
    steps:
      - name: Post welcome message for non-members
        uses: actions/github-script@v8
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            if (context.payload.pull_request.user.type === 'Bot') return;

            const { data: membership } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: author,
            });

            // A collaborator is a repository member; bots and members receive no greeting.
            if (membership.user.permissions === 'none') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `Thanks @${author} for your contribution to Failproof AI! 🙌\n\nWe'd love to discuss your PR and welcome you to our community: https://discord.befailproof.ai/`,
              });
            }

  approve-dependabot:
    name: Approve Dependabot PR
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Approve pull request
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE',
              body: 'Automated approval for Dependabot dependency update.',
            });
