name: Welcome contributors

on:
  pull_request_target:
    types: [opened]

# GitHub Actions approvals stay disabled; dependency updates require human review.
permissions:
  contents: read
  issues: write

jobs:
  welcome:
    name: Thank and welcome contributor
    runs-on: ubuntu-latest
    steps:
      - name: Post welcome message
        uses: actions/github-script@v9
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const isDependabot = author === 'dependabot[bot]';
            const body = isDependabot
              ? `Thanks @${author} for keeping our dependencies current! 🙌`
              : `Thanks @${author} for your contribution to Failproof AI! 🙌\n\nWe'd love to discuss your PR and welcome you to our community.\n\nDiscord: https://discord.befailproof.ai/\nReddit: https://www.reddit.com/r/failproofai/`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
