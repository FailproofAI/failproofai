name: Publish failproofai-sdk to PyPI

# The telemetry SDK (PyPI project: failproofai-sdk) ships on its own cadence, separate
# from the npm package, the daemon binaries in publish.yml, and its sibling fp-cli. It
# is a pure-Python wheel with no platform matrix and no release assets, so it has
# nothing to share with those pipelines beyond credentials it does not use.
#
# AUTHENTICATION IS PyPI TRUSTED PUBLISHING (OIDC) — there is no PYPI_API_TOKEN secret.
# This requires a one-time, out-of-band setup on PyPI that CANNOT be done from a PR:
#
#   PyPI project `failproofai-sdk` -> Manage -> Publishing -> Add a new pending publisher
#     Owner:            FailproofAI
#     Repository:       failproofai
#     Workflow name:    publish-failproofai-sdk.yml
#     Environment:      pypi-failproofai-sdk      <- REQUIRED, do not leave blank
#
# Until that publisher exists the `publish` job fails at the upload step with an OIDC
# error. Configure it BEFORE the first release, not after.
#
# The environment is load-bearing, not decoration. Every check in this file lives on the
# ref being dispatched, so a writer can delete them on a branch and click Run — the OIDC
# token is minted for whatever the workflow then asks for. Two settings OUTSIDE this file
# are what a branch edit cannot reach:
#
#   1. Repo -> Settings -> Environments -> `pypi-failproofai-sdk`:
#        Deployment branches: `main` only (and add required reviewers if you want a
#        second pair of eyes on every release).
#      A job referencing this environment from any other ref is refused before it starts.
#      NOTE: GitHub creates a missing environment implicitly, WITHOUT protection rules —
#      so this is not self-configuring; set it up by hand.
#   2. The `Environment: pypi-failproofai-sdk` field above. PyPI then rejects a token
#      whose `environment` claim is missing or different, which is what stops someone
#      from simply deleting the `environment:` line below.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify, but do not upload to PyPI
        type: boolean
        default: false

concurrency:
  group: publish-failproofai-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gates this job on the repo-level environment rules described in the header, and puts
    # the environment name in the OIDC token PyPI checks. Both halves are outside this file.
    environment: pypi-failproofai-sdk
    defaults:
      run:
        working-directory: sdk/python
    permissions:
      # Naming ANY scope sets every unnamed one to `none` — it is not an addition to the
      # defaults. `contents: read` is therefore not redundant: without it `actions/checkout`
      # gets a token that cannot read this repository.
      contents: read
      id-token: write    # required for Trusted Publishing
    steps:
      # Authentication is OIDC, so there is no token to withhold: repo write access IS
      # publish access, and `workflow_dispatch` can target ANY ref. Without these two
      # checks one "Run workflow" click on an unreviewed branch ships that branch to
      # public PyPI as an official failproofai-sdk release, unreviewable and
      # unrecallable (PyPI versions cannot be reused).
      #
      # These are the readable guard, not the enforcement: they live on the ref being
      # dispatched, so a writer could delete them on a branch. The `environment:` above
      # plus its two out-of-file settings (see the header) are what actually hold.
      - name: Authorize actor and branch
        env:
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$ACTOR" != "NiveditJain" ]; then
            echo "::error::Unauthorized. Only NiveditJain can publish failproofai-sdk."
            exit 1
          fi
          if [ "$REF" != "main" ]; then
            echo "::error::Refusing to publish from '$REF'. failproofai-sdk publishes from main only."
            exit 1
          fi

      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Never publish a version whose tests do not pass. This duplicates the ci job on
      # purpose: a workflow_dispatch can target any ref, including one CI never ran.
      # FAILPROOFAI_SDK_REQUIRE_CONTRACT turns a missing daemon source into a failure
      # rather than a skip, so the spool contract cannot go unverified on a release.
      - name: Test
        env:
          FAILPROOFAI_SDK_REQUIRE_CONTRACT: "1"
        run: uv run pytest tests/ -q

      - name: Build
        run: uv build

      - name: Verify the artifacts before uploading
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          modules = [n for n in names if n.startswith("failproofai_sdk/") and n.endswith(".py")]
          if len(modules) < 7:
              sys.exit(f"refusing to publish an empty wheel ({len(modules)} modules)")
          if not any(n.endswith("LICENSE") for n in names):
              sys.exit("refusing to publish without a LICENSE in the wheel")
          # py.typed is the only thing that makes the annotations count for a
          # type checker, and it is absent from the wheel unless package-data
          # names it — a build that silently drops it looks identical here
          # otherwise.
          if not any(n.endswith("py.typed") for n in names):
              sys.exit("refusing to publish without py.typed in the wheel")
          print(f"{wheel}: {len(modules)} modules, licence and py.typed present")
          PY

      # The CI job proves the artifact installs with no dependencies and emits real
      # events; the publish path must not prove less than CI does. A wheel whose zip
      # looks right but which cannot import, or which quietly acquired a dependency,
      # is exactly the failure this catches — and it is unrecallable once uploaded.
      - name: Smoke-test the artifact exactly as a user would receive it
        run: |
          uv venv /tmp/sdk-publish-smoke
          # --no-deps is the assertion, not an optimisation: this package must
          # install and work with nothing else present.
          VIRTUAL_ENV=/tmp/sdk-publish-smoke uv pip install --no-deps dist/*.whl
          AGENTEYE_HOME=/tmp/sdk-publish-spool /tmp/sdk-publish-smoke/bin/python -c "
          import failproofai_sdk as s
          print(s.__version__)
          s.event.agent_start(session_id='smoke', agent_id='a', goal='publish check')
          s.event.tool_use(session_id='smoke', agent_id='a', tool_name='t', tool_call_id='c')
          s.event.tool_result(session_id='smoke', agent_id='a', tool_name='t', tool_call_id='c', output='ok')
          "
          python3 - <<'PY'
          import glob, json, sys
          batches = glob.glob("/tmp/sdk-publish-spool/events/*.jsonl")
          if not batches:
              sys.exit("the installed wheel wrote no event batch")
          events = [json.loads(l) for p in batches for l in open(p) if l.strip()]
          types = {e["type"] for e in events}
          if types != {"agent_start", "tool_use", "tool_result"}:
              sys.exit(f"unexpected events from the installed wheel: {sorted(types)}")
          print(f"{len(events)} events written by the installed artifact")
          PY

      - name: Report the version being published
        run: |
          VERSION=$(uv run python -c 'from failproofai_sdk._version import __version__; print(__version__)')
          echo "failproofai-sdk version: ${VERSION}"
          echo "### Publishing \`failproofai-sdk\` ${VERSION}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
