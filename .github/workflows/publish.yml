name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      FAILPROOFAI_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Token for the version-bot GitHub App — a bypass actor on the org-level
      # `failproofai-rules` ruleset (PR + 1 review required on main). The default
      # GITHUB_TOKEN is not a bypass actor, so the "Bump version for next
      # development cycle" push below is rejected with GH013 without this. Same
      # app and secrets the bump-platform-submodule workflow uses.
      - name: Mint version-bot app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.VERSION_BOT_APP_ID }}
          private-key: ${{ secrets.VERSION_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # Persist the app token so the version-bump `git push origin main`
          # below authenticates as the bypass actor, not the default token.
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: bun install --frozen-lockfile

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version and dist-tag
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")

          # Determine the publish version
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH_VERSION="$TAG_VERSION"
          else
            PUBLISH_VERSION="$PKG_VERSION"
          fi

          # Determine dist-tag
          if [[ "$PUBLISH_VERSION" == *-* ]]; then
            DIST_TAG="beta"
          else
            DIST_TAG="latest"
          fi

          # Compute the next development version
          if [[ "$PUBLISH_VERSION" == *-beta.* ]]; then
            BASE="${PUBLISH_VERSION%-beta.*}"
            BETA_NUM="${PUBLISH_VERSION##*-beta.}"
            NEXT_BETA=$((BETA_NUM + 1))
            NEXT_VERSION="${BASE}-beta.${NEXT_BETA}"
          elif [[ "$PUBLISH_VERSION" == *-* ]]; then
            echo "::warning::Non-beta prerelease '$PUBLISH_VERSION' — skipping auto-bump"
            NEXT_VERSION=""
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$PUBLISH_VERSION"
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-beta.0"
          fi

          echo "publish_version=$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          echo "Package.json version: $PKG_VERSION"
          echo "Publishing: $PUBLISH_VERSION (tag: $DIST_TAG)"
          echo "Next version: $NEXT_VERSION"

      - name: Set publish version in package.json
        if: steps.version.outputs.publish_version != steps.version.outputs.pkg_version
        run: |
          npm version "${{ steps.version.outputs.publish_version }}" --no-git-tag-version
          echo "Updated package.json to ${{ steps.version.outputs.publish_version }}"

      # LOAD-BEARING. `dist/` and `.next/standalone/` are gitignored but sit in
      # package.json's `files` allowlist, so the tarball is only non-empty
      # because something built them first. That something used to be the
      # `prepare` lifecycle script, which `bun install --frozen-lockfile` above
      # ran implicitly; `prepare` is gone (see scripts/check-versions.mjs, which
      # now fails the build if any lifecycle script comes back), so this step is
      # the ONLY thing standing between this workflow and publishing an empty
      # package. It runs after the version bump above because `build:cli`
      # inlines package.json's `version` into dist/cli.mjs — building earlier
      # would ship a binary that reports the previous version.
      - name: Build publishable artifacts
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 15
          command: bun run build

      - name: Verify build output is present
        run: |
          set -euo pipefail
          for f in dist/cli.mjs dist/index.js .next/standalone/server.js; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Missing or empty after \`bun run build\` — refusing to publish an incomplete package"
              exit 1
            fi
            echo "ok: $f ($(wc -c < "$f") bytes)"
          done

      # `--ignore-scripts` so a re-added lifecycle script can never silently
      # re-enter the publish path. The build above is explicit and verified.
      - name: Publish
        run: npm publish --provenance --ignore-scripts --tag ${{ steps.version.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish alias packages
        run: node scripts/publish-aliases.mjs --dist-tag ${{ steps.version.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Bump version for next development cycle
        if: steps.version.outputs.next_version != ''
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main

          npm version "$NEXT_VERSION" --no-git-tag-version

          git add package.json
          git commit -m "chore: bump version to $NEXT_VERSION [skip ci]"

          # Authenticated as the version-bot App (persisted by the checkout above),
          # which bypasses the ruleset's pull-request requirement on main.
          git push origin main
