[package]
name = "fpai-ipc"
description = "Wire framing, envelope types, and peer credentials for the failproofaid local IPC protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["tokio"]
# The async framing helpers. On by default because `failproofaid` is a tokio
# listener; opt out (`default-features = false`) for a sync-only consumer such as
# the transient hook client, which opens one socket, writes one frame, and exits.
tokio = ["dep:tokio"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util"], optional = true }

[target.'cfg(unix)'.dependencies]
# `nix` covers every syscall this crate needs behind a safe wrapper: SO_PEERCRED
# on Linux, getpeereid(2) on macOS, and — the one that actually matters — a
# getpwuid_r bound that already implements the ERANGE grow-the-buffer loop and
# reports "no such user" as Ok(None) rather than as an error.
nix = { version = "0.31.3", default-features = false, features = ["socket", "user"] }

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "net"] }
