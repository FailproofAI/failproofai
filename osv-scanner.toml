# OSV-Scanner allow-list — auto-loaded by the Supply Chain CI gate
# (.github/workflows/osv-scanner.yml) when it scans bun.lock.
#
# The gate blocks on ANY known-vulnerable or malicious dependency. When a finding
# has no available fix (e.g. an unpatched transitive advisory), add a justified,
# time-boxed entry here so unrelated PRs aren't blocked. Always prefer FIXING
# (bump the dependency, or pin it via `overrides` in package.json) over ignoring.
# Keep this list short and re-review entries when their ignoreUntil date passes.
#
# Every entry MUST include a reason and an ignoreUntil date. Example:
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-07-01
# reason = "No upstream fix yet; transitive via <pkg>; not reachable in our usage. Re-review by 2026-07-01."
#
# Both identifiers for the same advisory. The scanner matches `id` against the
# record's PRIMARY id, which for a PyPI advisory is the PYSEC one — ignoring only
# the GHSA alias loaded cleanly, changed nothing, and left the gate red.
[[IgnoredVulns]]
id = "PYSEC-2026-311"
ignoreUntil = 2026-11-20
reason = "Alias of GHSA-f4j7-r4q5-qw2c; see the entry below for the full justification. Re-review by 2026-11-20."

[[IgnoredVulns]]
id = "GHSA-f4j7-r4q5-qw2c"
ignoreUntil = 2026-11-20
reason = """
chromadb 1.1.1, transitive via crewai, in sdk/python/uv.lock. No fixed version exists — OSV reports "0 vulnerabilities can be fixed" and an empty FIXED VERSION — so there is nothing to bump to. It is not reachable from anything we ship: failproofai-sdk declares NO unconditional dependencies (every Requires-Dist in the built wheel is gated behind an extra, and CI installs it with --no-deps), so `pip install failproofai-sdk` never brings chromadb. It arrives only via `failproofai-sdk[crewai]`, which installs CrewAI — and anyone installing CrewAI has chromadb from CrewAI regardless of us. sdk/python/uv.lock is the dev/test lockfile that pins every extra so CI can exercise the adapters; it is not a published artifact. The lockfile stays in the scan on purpose, so a FIXABLE finding here still blocks. Re-review by 2026-11-20, by which point either chromadb has a patched release or crewai has moved off it.
"""
