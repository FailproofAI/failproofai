# OSV-Scanner allow-list — auto-loaded by the Supply Chain CI gate
# (.github/workflows/osv-scanner.yml) when it scans bun.lock, Cargo.lock, the
# two uv.lock files and sdk/typescript/package-lock.json.
#
# The gate blocks on ANY known-vulnerable or malicious dependency. When a finding
# has no available fix (e.g. an unpatched transitive advisory), add a justified,
# time-boxed entry here so unrelated PRs aren't blocked. Always prefer FIXING
# (bump the dependency, or pin it via `overrides` in package.json) over ignoring.
# Keep this list short and re-review entries when their date passes.
#
# Two mechanisms, and the reason to reach for each:
#
#   [[IgnoredVulns]] silences ONE advisory by id, and is what every entry below
#   uses. It is the narrowest thing that works: any OTHER advisory
#   against the same package still blocks, including a newly FIXABLE one — which
#   is the signal worth keeping, because a fixable finding is one we would act on.
#
#   [[PackageOverrides]] silences every advisory against a package, and no entry
#   below uses it at present. It also suppresses fixable findings,
#   so it costs exactly the signal above; see SECURITY.md for the narrow case that
#   justifies it and the conditions attached. Note the different date key there —
#   `effectiveUntil`, not `ignoreUntil`.
#
# The scanner matches aliases, so ONE id per advisory is enough — listing a
# PYSEC id alongside its GHSA alias just produces an "unused ignores" warning.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-07-01
# reason = "No upstream fix yet; transitive via <pkg>; not reachable in our usage. Re-review by 2026-07-01."

# ---------------------------------------------------------------------------
# chromadb: no entries any more. Four advisories against chromadb 1.5.9 (no
# fixed version) were allow-listed here until 2026-11-20, when crewai 1.15.44
# made chromadb an optional extra of its own; sdk/python/uv.lock moved to it and
# no longer contains chromadb at all.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# picomatch — ReDoS through single-branch repeated extglobs (GHSA-fc5q-39xc-vjpf).
#
#   Affects every release through 4.0.7, the newest on npm, so there is no fixed
#   version to bump or override to. Where it is:
#
#   - bun.lock (2.3.2 via micromatch / fast-glob, 4.0.4 and 4.0.7 via
#     tinyglobby, vite and vitest) and sdk/typescript/package-lock.json (vitest,
#     dev): build, lint and test tooling, which only ever matches globs from our
#     own config.
#   - SHIPPED, inside Next.js: the published tarball's dashboard bundle carries
#     .next/standalone/node_modules/next/dist/compiled/picomatch. Its only
#     importers there are next/dist/shared/lib/match-remote-pattern.js and
#     match-local-pattern.js, which match an image URL against the GLOBS in
#     next.config's images.remotePatterns / localPatterns. Our next.config sets
#     `images: { unoptimized: true }` and declares no patterns, so those globs
#     are build-time config at most and never come from a request. A visitor can
#     only influence the string being matched, while this ReDoS needs an
#     attacker-supplied glob.
#
#   No code in this repo imports picomatch or hands it a pattern, and
#   `@failproofai/sdk` has no dependencies.
#
#   Re-review by 2026-12-18, or as soon as a fixed picomatch is published —
#   then bump (or pin via `overrides`) and delete this entry.

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-18
reason = "picomatch <=4.0.7 ReDoS; no fixed release exists. In build/lint/test tooling, and shipped inside the Next.js dashboard bundle, where it only matches image URLs against globs from next.config (we declare none); no attacker-supplied glob reaches it. Re-review by 2026-12-18."
